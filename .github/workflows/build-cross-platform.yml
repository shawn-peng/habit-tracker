name: Build Cross-Platform Clients & Test Backend

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      ios_target:
        description: "iPhone build mode (ipa-unsigned outputs sideloadable .ipa for SideStore/AltStore/Sideloadly; ios-simulator builds macOS Simulator .app; ipa-signed uses IOS_TEAM_ID)"
        required: false
        default: "ipa-unsigned"
        type: choice
        options:
          - ipa-unsigned
          - ios-simulator
          - ipa-signed
      ios_only:
        description: "Only build the iPhone artifact (skip macOS desktop, Web, and Android builds for faster IPA turnaround)"
        required: false
        default: false
        type: boolean

env:
  PYTHONUTF8: "1"
  FLET_CLI_NO_RICH_OUTPUT: "1"

jobs:
  backend-tests:
    name: Backend Unit Tests (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Streak & Schema Tests
        working-directory: backend
        run: pytest -v

  build-android-native:
    name: Build Native Android App (Kotlin & Compose APK)
    runs-on: ubuntu-latest
    needs: backend-tests
    if: github.event_name != 'workflow_dispatch' || !inputs.ios_only
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests & Build Debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk HabitTracker-Android-debug.apk

      - name: Upload Native Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-native-apk
          path: android/HabitTracker-Android-debug.apk
          if-no-files-found: error

  build-web-and-android:
    name: Build Web & Android (.apk)
    runs-on: ubuntu-latest
    needs: backend-tests
    if: github.event_name == 'workflow_dispatch' && !inputs.ios_only
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: frontend/requirements.txt

      - name: Cache Flet & Flutter Toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/flutter
            ~/.flet
          key: flet-linux-${{ hashFiles('frontend/pyproject.toml', 'frontend/requirements.txt') }}

      - name: Install uv & Flet CLI
        working-directory: frontend
        run: |
          python -m pip install --upgrade pip uv
          pip install -r requirements.txt

      - name: Build Static Web App
        working-directory: frontend
        run: flet build web --yes --verbose

      - name: Build Android APK
        working-directory: frontend
        run: flet build apk --yes --verbose

      - name: Upload Web & Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-and-android-builds
          path: |
            frontend/build/web
            frontend/build/apk
          if-no-files-found: error

  build-macos-and-ios:
    name: Build macOS (.app) & iPhone (iOS)
    runs-on: macos-latest
    needs: backend-tests
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: frontend/requirements.txt

      - name: Cache Flet & Flutter Toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/flutter
            ~/.flet
          key: flet-macos-${{ hashFiles('frontend/pyproject.toml', 'frontend/requirements.txt') }}

      - name: Install uv & Flet CLI
        working-directory: frontend
        run: |
          python -m pip install --upgrade pip uv
          pip install -r requirements.txt

      - name: Build macOS Desktop App (.app)
        if: ${{ !inputs.ios_only }}
        working-directory: frontend
        run: |
          flet build macos --yes --verbose
          ditto -c -k --sequesterRsrc --keepParent build/macos HabitTracker-macOS.zip

      - name: Build iPhone App (${{ inputs.ios_target || 'ipa-unsigned' }})
        working-directory: frontend
        env:
          IOS_MODE: ${{ inputs.ios_target || 'ipa-unsigned' }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          if [ "$IOS_MODE" = "ipa-signed" ]; then
            if [ -z "$IOS_TEAM_ID" ]; then
              echo "::error::IOS_TEAM_ID secret is required when ios_target is ipa-signed."
              exit 1
            fi
            flet build ipa --yes --verbose --ios-team-id "$IOS_TEAM_ID"
          elif [ "$IOS_MODE" = "ipa-unsigned" ]; then
            flet build ipa --yes --verbose
            ARCHIVE_PATH=$(find build/ipa -maxdepth 2 -name "*.xcarchive" | head -n 1)
            if [ -z "$ARCHIVE_PATH" ]; then
              ARCHIVE_PATH=$(find build -maxdepth 5 -name "*.xcarchive" | head -n 1)
            fi
            if [ -z "$ARCHIVE_PATH" ]; then
              echo "::error::No .xcarchive found under frontend/build after unsigned iOS build."
              exit 1
            fi
            APP_BUNDLE=$(find "$ARCHIVE_PATH/Products/Applications" -maxdepth 1 -name "*.app" | head -n 1)
            if [ -z "$APP_BUNDLE" ]; then
              echo "::error::No .app bundle found inside $ARCHIVE_PATH/Products/Applications."
              exit 1
            fi
            STAGE_DIR=$(mktemp -d)
            mkdir -p "$STAGE_DIR/Payload"
            cp -RP "$APP_BUNDLE" "$STAGE_DIR/Payload/$(basename "$APP_BUNDLE")"
            (
              cd "$STAGE_DIR"
              zip -qry "$OLDPWD/HabitTracker-iOS-Unsigned.ipa" Payload
            )
            rm -rf "$STAGE_DIR"
            unzip -Z1 HabitTracker-iOS-Unsigned.ipa | grep -q "^Payload/.*\.app/Info\.plist$"
            ls -lh HabitTracker-iOS-Unsigned.ipa
          else
            flet build ios-simulator --yes --verbose
            ditto -c -k --sequesterRsrc --keepParent build/ios-simulator HabitTracker-iOS-Simulator.zip
          fi

      - name: Upload iPhone IPA
        if: ${{ (inputs.ios_target || 'ipa-unsigned') != 'ios-simulator' }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: |
            frontend/HabitTracker-iOS-*.ipa
            frontend/build/ipa/*.ipa
          if-no-files-found: error

      - name: Upload macOS & iOS Simulator Bundles
        if: ${{ !inputs.ios_only || inputs.ios_target == 'ios-simulator' }}
        uses: actions/upload-artifact@v4
        with:
          name: apple-macos-and-simulator-builds
          path: frontend/HabitTracker-*.zip
          if-no-files-found: error
