name: Deploy Frontend Server to Cloud Run

on:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:
    inputs:
      habit_api_url:
        description: "Override backend API URL (defaults to repo var HABIT_API_URL or Cloud Run backend)"
        required: false
        type: string

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  GCP_PROJECT_ID: shawn-habit-tracker-2026
  GCP_REGION: us-central1
  ARTIFACT_REGISTRY_REPO: cloud-run-source-deploy
  CLOUD_RUN_SERVICE: habit-tracker-web
  RUNTIME_SERVICE_ACCOUNT: habit-tracker-web-runtime@shawn-habit-tracker-2026.iam.gserviceaccount.com

jobs:
  verify-frontend:
    name: Verify Frontend Web Server (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: frontend/requirements-server.txt

      - name: Install Frontend Server Dependencies
        working-directory: frontend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-server.txt

      - name: Smoke Test Frontend ASGI App
        working-directory: frontend
        run: |
          python -c "
          from fastapi.testclient import TestClient
          import server

          with TestClient(server.app) as client:
              health_resp = client.get('/health')
              assert health_resp.status_code == 200, health_resp.text
              assert health_resp.json() == {'status': 'ok'}, health_resp.json()

              index_resp = client.get('/')
              assert index_resp.status_code == 200, index_resp.status_code
              assert 'Habit & Routine Tracker' in index_resp.text, 'Missing app title in HTML'
          print('Frontend ASGI smoke test passed')
          "

  deploy-cloud-run:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: verify-frontend
    concurrency:
      group: deploy-frontend-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    environment:
      name: frontend-production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || 'projects/142205380680/locations/global/workloadIdentityPools/github-actions/providers/github-oidc' }}
          service_account: ${{ vars.GCP_FRONTEND_DEPLOYER_SA || 'github-frontend-deployer@shawn-habit-tracker-2026.iam.gserviceaccount.com' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build & Push Frontend Container Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.CLOUD_RUN_SERVICE }}:${{ github.sha }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.CLOUD_RUN_SERVICE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.CLOUD_RUN_SERVICE }}:${{ github.sha }}
          env_vars: |
            HABIT_API_URL=${{ inputs.habit_api_url || vars.HABIT_API_URL || 'https://habit-tracker-api-142205380680.us-central1.run.app' }}
          flags: >-
            --allow-unauthenticated
            --service-account=${{ env.RUNTIME_SERVICE_ACCOUNT }}
            --port=8080
            --cpu=1
            --memory=512Mi
            --concurrency=80
            --max-instances=1
            --session-affinity
            --cpu-boost
            --timeout=3600

      - name: Verify Live Deployment & Write Summary
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          healthy=false
          for attempt in 1 2 3 4 5; do
            body=$(curl -fsSL "${SERVICE_URL}/health" || true)
            if echo "$body" | grep -q '"status"[[:space:]]*:[[:space:]]*"ok"'; then
              healthy=true
              echo "Health check passed on attempt ${attempt}: ${body}"
              break
            fi
            echo "Attempt ${attempt} did not pass health check yet; retrying in 3s..."
            sleep 3
          done
          if [ "$healthy" != "true" ]; then
            echo "::error::Health check failed at ${SERVICE_URL}/health"
            exit 1
          fi

          html=$(curl -fsSL "${SERVICE_URL}/")
          if ! echo "$html" | grep -q "Habit"; then
            echo "::error::Root page at ${SERVICE_URL}/ did not contain expected Habit title"
            exit 1
          fi

          {
            echo "## Frontend Server Deployment Summary"
            echo ""
            echo "| Field | Value |"
            echo "| :--- | :--- |"
            echo "| Service | \`${CLOUD_RUN_SERVICE}\` |"
            echo "| Region | \`${GCP_REGION}\` |"
            echo "| Project | \`${GCP_PROJECT_ID}\` |"
            echo "| URL | ${SERVICE_URL} |"
            echo "| Image | \`${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REGISTRY_REPO}/${CLOUD_RUN_SERVICE}:${GITHUB_SHA}\` |"
            echo "| Health Check | \`GET /health\` -> \`{\"status\":\"ok\"}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
