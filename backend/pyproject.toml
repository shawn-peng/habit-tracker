[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "habit-tracker-backend"
version = "0.1.0"
description = "FastAPI + MongoDB backend for Cross-Platform Habit & Routine Tracker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pymongo>=4.10.0",
    "PyJWT>=2.9.0",
    "pwdlib[argon2]>=0.2.1",
    "pydantic[email]>=2.10.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

